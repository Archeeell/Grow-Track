name: Daily maintenance

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-maintenance-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Generate maintenance checklist entry
        run: python .github/scripts/daily_maintenance.py

      - name: Commit maintenance log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily-maintenance.md
          if git diff --cached --quiet; then
            echo "No maintenance log changes to commit."
            exit 0
          fi
          git commit -m "docs: add daily maintenance checklist"
          git push
